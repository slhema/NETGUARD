<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NETGUARD | Network Security</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="login-container">

        <section class="login-card">

            <!-- NETGUARD BRAND -->
            <div class="brand">

                <div class="brand-icon">N</div>

                <div>
                    <h1>NETGUARD</h1>
                    <p>Network Security Monitor</p>
                </div>

            </div>


            <!-- LOGIN HEADING -->
            <div class="login-heading">

                <h2>Welcome back</h2>

                <p>
                    Sign in to monitor your network securely.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">

                    Sign in

                    <span>→</span>

                </button>

            </form>


            <!-- REGISTER LINK -->
            <div class="register-text">

                <span>New to NETGUARD?</span>

                <a href="register.html">
                    Create account
                </a>

            </div>


            <!-- SECURITY STATUS -->
            <div class="security-note">

                <span class="status-dot"></span>

                Protected network environment

            </div>

        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
